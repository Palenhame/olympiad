<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>PvP</title>

    <style>
        body {
            font-family: sans-serif;
        }

        .progress-wrapper {
            margin-bottom: 15px;
        }

        .progress-label {
            font-size: 14px;
            margin-bottom: 3px;
        }

        .progress-bar {
            width: 100%;
            height: 16px;
            background: #ddd;
            border-radius: 8px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            transition: width 0.3s;
        }

        .my-fill {
            background: #4caf50;
        }

        .enemy-fill {
            background: #f44336;
        }

        .tasks {
            display: flex;
            gap: 6px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .task-btn {
            width: 40px;
            height: 40px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            background: #eee;
        }

        .my-correct { background: #4caf50; color: white; }
        .my-wrong   { background: #f44336; color: white; }

        .enemy-correct { outline: 3px solid #4caf50; }
        .enemy-wrong   { outline: 3px solid #f44336; }
    </style>
</head>
<body>

<h2>PvP режим</h2>

<!-- ПРОГРЕСС -->
<div class="progress-wrapper">
    <div class="progress-label">Ты</div>
    <div class="progress-bar">
        <div class="progress-fill my-fill" id="myProgress"></div>
    </div>
</div>

<div class="progress-wrapper">
    <div class="progress-label">Противник</div>
    <div class="progress-bar">
        <div class="progress-fill enemy-fill" id="enemyProgress"></div>
    </div>
</div>

<hr>

<div class="tasks" id="taskButtons"></div>

<hr>

<div>
    <strong>Задание:</strong>
    <div id="task">Ожидание...</div>
</div>

<hr>

<input type="text" id="answer" placeholder="Введите ответ">
<button id="send">Отправить</button>

<hr>

<div>
    <strong>Статус:</strong>
    <div id="status">Подключение...</div>
</div>

<!-- данные из Django -->
{{ tasks|json_script:"tasks-data" }}

<script>
    const roomId = "{{ room_id }}";

    // tasksData = [{question:"1", is_correct:null}, ...]
    const tasksData = JSON.parse(
        document.getElementById("tasks-data").textContent
    );

    const tasks = tasksData.map(t => t.question);
    let currentIndex = 0;

    let myResults = Array(tasks.length).fill(null);
    let enemyResults = Array(tasks.length).fill(null);

    // инициализация статусов пользователя
    tasksData.forEach((t, i) => {
        if (t.is_correct === true || t.is_correct === false) {
            myResults[i] = t.is_correct;
        }
    });

    const socket = new WebSocket(
        `ws://${window.location.host}/ws/pvp/${roomId}/`
    );

    const taskEl = document.getElementById("task");
    const statusEl = document.getElementById("status");
    const buttonsEl = document.getElementById("taskButtons");

    const myProgressEl = document.getElementById("myProgress");
    const enemyProgressEl = document.getElementById("enemyProgress");

    function calcProgress(results) {
        const solved = results.filter(v => v === true || v === false).length;
        return (solved / tasks.length) * 100;
    }

    function updateProgress() {
        myProgressEl.style.width = calcProgress(myResults) + "%";
        enemyProgressEl.style.width = calcProgress(enemyResults) + "%";
    }

    function renderButtons() {
        buttonsEl.innerHTML = "";

        tasks.forEach((_, i) => {
            const btn = document.createElement("button");
            btn.className = "task-btn";
            btn.innerText = i + 1;

            if (myResults[i] === true) btn.classList.add("my-correct");
            if (myResults[i] === false) btn.classList.add("my-wrong");

            if (enemyResults[i] === true) btn.classList.add("enemy-correct");
            if (enemyResults[i] === false) btn.classList.add("enemy-wrong");

            btn.onclick = () => {
                currentIndex = i;
                renderTask();
            };

            buttonsEl.appendChild(btn);
        });

        updateProgress();
    }

    function renderTask() {
        taskEl.innerText = tasks[currentIndex];
        renderButtons();
    }

    socket.onopen = () => {
        statusEl.innerText = "Подключено";
        renderTask();
    };

    socket.onmessage = (event) => {
        const data = JSON.parse(event.data);

        if (data.type === "result") {
            myResults[data.task_index] = data.is_correct;
            statusEl.innerText = data.correct ? "Правильно" : "Неправильно";
            renderButtons();
        }

        if (data.type === "enemy_result") {
            enemyResults[data.task_index] = data.is_correct;
            renderButtons();
        }
    };

    document.getElementById("send").onclick = () => {
        socket.send(JSON.stringify({
            type: "answer",
            task_index: currentIndex,
            answer: document.getElementById("answer").value
        }));

        document.getElementById("answer").value = "";
    };
</script>

</body>
</html>
