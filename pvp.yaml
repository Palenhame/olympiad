openapi: 3.0.3

info:
  title: PVP WebSocket API
  version: 1.0.0
  description: |
    WebSocket API для PVP-режима с математическими заданиями.
    Типы сообщений:
      - tasks: список заданий
      - answer: ответ игрока
      - result: результат ответа игрока
      - enemy_result: результат ответа соперника

paths:
  /ws/pvp/{room_id}/:
    get:
      summary: WebSocket connection
      parameters:
        - name: room_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "101":
          description: Switching Protocols

components:
  schemas:
    TasksMessage:
      type: object
      additionalProperties: false
      required:
        - type
        - tasks
      properties:
        type:
          type: string
          enum: ["tasks"]
        tasks:
          type: array
          minItems: 1
          items:
            type: string

    AnswerMessage:
      type: object
      additionalProperties: false
      required:
        - type
        - task_index
        - answer
      properties:
        type:
          type: string
          enum: ["answer"]
        task_index:
          type: integer
          minimum: 0
        answer:
          type: string
          minLength: 1

    ResultMessage:
      type: object
      additionalProperties: false
      required:
        - type
        - task_index
        - correct
      properties:
        type:
          type: string
          enum: ["result"]
        task_index:
          type: integer
          minimum: 0
        correct:
          type: boolean

    EnemyResultMessage:
      type: object
      additionalProperties: false
      required:
        - type
        - task_index
        - correct
      properties:
        type:
          type: string
          enum: ["enemy_result"]
        task_index:
          type: integer
          minimum: 0
        correct:
          type: boolean
